connector.name=web3

# Trino resolves ${ENV:ALCHEMY_API_KEY} from the environment of every node.
# Do not replace this with a literal key or commit a populated .env file.
# Ethereum does not publish an unauthenticated official RPC; use the
# environment-backed Alchemy endpoint, then fall back to PublicNode.
web3.ethereum.rpc-url=https://eth-mainnet.g.alchemy.com/v2/${ENV:ALCHEMY_API_KEY}
web3.ethereum.rpc-fallback-urls=https://ethereum-rpc.publicnode.com
# EVM mainnets: official RPC first, with a configured PublicNode fallback.
web3.base.rpc-url=https://mainnet.base.org
web3.base.rpc-fallback-urls=https://base-rpc.publicnode.com
web3.optimism.rpc-url=https://mainnet.optimism.io
web3.optimism.rpc-fallback-urls=https://optimism-rpc.publicnode.com
web3.arbitrum.rpc-url=https://arb1.arbitrum.io/rpc
web3.arbitrum.rpc-fallback-urls=https://arbitrum-one-rpc.publicnode.com
web3.bnb.rpc-url=https://bsc-dataseed1.bnbchain.org
web3.bnb.rpc-fallback-urls=https://bsc-rpc.publicnode.com
# Polygon's public official URL currently returns 401; use the configured PublicNode RPC.
web3.polygon.rpc-url=https://polygon-bor-rpc.publicnode.com
web3.avalanche.rpc-url=https://api.avax.network/ext/bc/C/rpc
web3.avalanche.rpc-fallback-urls=https://avalanche-c-chain-rpc.publicnode.com
web3.gnosis.rpc-url=https://rpc.gnosischain.com
web3.gnosis.rpc-fallback-urls=https://gnosis-rpc.publicnode.com
web3.kaia.rpc-url=https://public-en.node.kaia.io
web3.story.rpc-url=https://mainnet.storyrpc.io
web3.story.rpc-fallback-urls=https://story-rpc.publicnode.com
web3.boba.rpc-url=https://mainnet.boba.network
web3.celo.rpc-url=https://forno.celo.org
web3.celo.rpc-fallback-urls=https://celo-rpc.publicnode.com
web3.hyperevm.rpc-url=https://rpc.hyperliquid.xyz/evm
web3.abstract.rpc-url=https://api.mainnet.abs.xyz
web3.anime.rpc-url=https://public-rpc.anime.xyz
web3.apechain.rpc-url=https://rpc.apechain.com
web3.ink.rpc-url=https://rpc-gel.inkonchain.com
web3.jovay.rpc-url=https://rpc.jovay.io
web3.linea.rpc-url=https://rpc.linea.build
web3.linea.rpc-fallback-urls=https://linea-rpc.publicnode.com
