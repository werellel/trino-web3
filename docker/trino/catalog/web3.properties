# Aptos official mainnet fullnode REST origin; the connector appends /v1 paths.
web3.aptos.rest-url=https://fullnode.mainnet.aptoslabs.com
# Solana Foundation mainnet RPC; fall back to the configured PublicNode RPC.
web3.solana.rpc-url=https://api.mainnet-beta.solana.com
web3.solana.rpc-fallback-urls=https://solana-rpc.publicnode.com
# Tron mainnet PublicNode REST origin.
web3.tron.api-url=https://tron-rpc.publicnode.com
# Sui mainnet PublicNode JSON-RPC endpoint.
web3.sui.rpc-url=https://sui-rpc.publicnode.com
# Cosmos Hub's public chain-directory URL requires a path, which is not
# accepted by the connector's origin-only REST contract; use PublicNode.
web3.cosmos.rest-url=https://cosmos-rest.publicnode.com
web3.osmosis.rest-url=https://lcd.osmosis.zone
web3.osmosis.rest-fallback-urls=https://osmosis-rest.publicnode.com
web3.injective.rest-url=https://sentry.lcd.injective.network
web3.injective.rest-fallback-urls=https://injective-rest.publicnode.com
# Bitcoin Core JSON-RPC is available through PublicNode; no unauthenticated
# official mainnet endpoint is published.
web3.bitcoin.rpc-url=https://bitcoin-rpc.publicnode.com
# Litecoin, Dogecoin, and Bitcoin Cash require an operator-provided RPC URL.
# Their public-node endpoints are not shipped in this catalog.
# Non-EVM testnets with configured public endpoints.
web3.solana-devnet.rpc-url=https://api.devnet.solana.com
web3.aptos-testnet.rest-url=https://fullnode.testnet.aptoslabs.com
web3.tron-nile.api-url=https://nile.trongrid.io
web3.tron-shasta.api-url=https://api.shasta.trongrid.io
web3.sui-testnet.rpc-url=https://sui-testnet-rpc.publicnode.com
web3.osmosis-testnet.rest-url=https://lcd.testnet.osmosis.zone
web3.injective-testnet.rest-url=https://testnet.sentry.lcd.injective.network
web3.injective-testnet.rest-fallback-urls=https://injective-testnet-rest.publicnode.com
# HyperEVM testnet uses the current official endpoint above; its former
# api.hyperliquid-testnet.xyz/evm URL is retired.
# Cosmos Hub testnet and UTXO testnets require operator-specific endpoints.
web3.rpc.json-rpc-batch-enabled=false
web3.cache.enabled=false

# Firo PublicNode (https://firo.publicnode.com) is not enabled here because
# this release does not yet register a Firo chain adapter or schema.
