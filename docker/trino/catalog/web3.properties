connector.name=web3

# Trino resolves ${ENV:ALCHEMY_API_KEY} from the environment of every node.
# Do not replace this with a literal key or commit a populated .env file.
web3.ethereum.rpc-url=https://eth-mainnet.g.alchemy.com/v2/${ENV:ALCHEMY_API_KEY}
web3.ethereum.rpc-fallback-urls=https://ethereum-rpc.publicnode.com
# Aptos PublicNode REST origin; the connector appends its native /v1 paths.
web3.aptos.rest-url=https://aptos-rest.publicnode.com
web3.rpc.json-rpc-batch-enabled=false
web3.cache.enabled=false

# Firo PublicNode (https://firo.publicnode.com) is not enabled here because
# this release does not yet register a Firo chain adapter or schema.
