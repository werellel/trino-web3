# Degen, CrossFi, and Arc mainnet endpoints were not available during verification.
# Keep their schemas metadata-only until a reachable network endpoint is published.
# EVM testnets: official RPC first where reachable; PublicNode is used when the
# official public endpoint is unavailable.
# Ethereum Sepolia's documented rpc.sepolia.org returned 404 and Polygon Amoy's
# official endpoint failed DNS, so those two use PublicNode as primary.
