name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Verify release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set release version
        run: >-
          mvn --batch-mode --errors
          org.codehaus.mojo:versions-maven-plugin:2.17.0:set
          -DnewVersion=${{ steps.version.outputs.version }}
          -DgenerateBackupPoms=false
          -DprocessAllModules=true

      - name: Verify release
        run: mvn --batch-mode --errors verify

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          trino-web3-plugin/target/trino-web3-plugin-${{ steps.version.outputs.version }}-plugin.zip
          --generate-notes
